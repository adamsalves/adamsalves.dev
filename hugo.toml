baseURL = "https://adamsalves.dev/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false   # en at /, pt at /pt/
theme = "terminal-mono"
enableRobotsTXT = true
enableEmoji = true
summaryLength = 30

[pagination]
  pagerSize = 5

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# ============================================================
#  Shared (non-translatable) params — merged into every language.
# ============================================================
[params]
  showScanlines = true       # CRT scanline overlay
  readingProgress = true     # reading-progress bar on posts
  terminalUser = "adams@portfolio"
  allowIndexing = true       # allow indexing even outside production
  # favicon = "/favicon.svg" # the theme ships a favicon; set to override
  # ogImage = "/img/og.png"  # default image for Open Graph/Twitter
  # twitter = "adamsalves"   # handle (without @) for twitter:site

  [params.navbar]
    brandName = "adamsalves"

  [params.hero.socialLinks]
    [[params.hero.socialLinks.fontAwesomeIcons]]
      icon = "fab fa-github"
      url = "https://github.com/adamsalves"
    [[params.hero.socialLinks.fontAwesomeIcons]]
      icon = "fab fa-linkedin-in"
      url = "https://linkedin.com/in/adams-alves"

  [params.about.skills]
    enable = true
    items = ["JavaScript", "Vue.js", "React", "HTML5", "CSS3", "SASS", "GraphQL", "TypeScript"]

  [params.footer]
    copyright = "adamsalves.dev"
    [params.footer.socialNetworks]
      github = "https://github.com/adamsalves"
      linkedin = "https://linkedin.com/in/adams-alves"

# ============================================================
#  English (default) — text is illustrative; swap in your data.
# ============================================================
[languages.en]
  label = "English"
  locale = "en-US"
  weight = 1
  title = "Adams Alves"

  [languages.en.params]
    title = "Adams Alves"
    description = "Front-End developer based in São Paulo — JavaScript, Vue.js and React. I build interfaces that work well and are pleasant to use."

    [languages.en.params.hero]
      intro = "hi, my name is"
      subtitle = "Front-End Developer"
      location = "São Paulo, Brazil"
      content = "I build interfaces that work well and are pleasant to use, with JavaScript (ES6+), Vue.js and React. Based in São Paulo, Brazil."

    [languages.en.params.about]
      content = """
I'm a Front-End developer based in São Paulo, Brazil. I work on projects built with JavaScript (ES6+) and tools like Vue.js, React, HTML5, CSS3 and SASS. I enjoy learning and experimenting with new technologies.

Right now I'm sharpening my skills in React, GraphQL and testing (TDD) in JavaScript. In my free time I enjoy video games, sports (football, basketball and cycling) and music."""

    [languages.en.params.contact]
      title = "Let's talk?"
      content = "My inbox is always open. Whether you have a question or just want to say hi, I'll do my best to get back to you!"
      btnName = "send email"
      btnLink = "mailto:contato@adamsalves.com.br"

    [languages.en.params.experience]
      enable = true
      [[languages.en.params.experience.items]]
        company = "Current Company"
        [[languages.en.params.experience.items.jobs]]
          name = "Front-End Developer"
          date = "Jan 2023 — present"
          content = "Building interfaces with Vue.js and React, focused on performance, accessibility and design systems."
      [[languages.en.params.experience.items]]
        company = "Previous Company"
        [[languages.en.params.experience.items.jobs]]
          name = "Junior Front-End Developer"
          date = "2021 — 2022"
          content = "Componentized screens, integrated REST/GraphQL APIs and wrote automated tests."

    [languages.en.params.projects]
      [[languages.en.params.projects.items]]
        title = "Pedala Sampa"
        repo = "pedala-sampa"
        language = "Vue / Nuxt"
        tagline = "collaborative map for São Paulo cyclists"
        content = "Find cycling groups by region, day, time, level and pace on an interactive map. Migrated to Nuxt 3 with a *wayfinding* redesign and two themes (light/dark)."
        badges = ["nuxt", "vue", "leaflet", "graphql", "typescript"]
        [languages.en.params.projects.items.featured]
          name = "demo"
          link = "https://pedalasampa.netlify.app"
        [[languages.en.params.projects.items.links]]
          icon = "fab fa-github"
          url = "https://github.com/adams-alves-dev/pedala-sampa"
      [[languages.en.params.projects.items]]
        title = "Phantom: The Collector"
        repo = "phantom-collector"
        language = "TypeScript"
        tagline = "retro 8-bit arcade game"
        content = "Collect coins, dodge specters and clear stages. Arcade physics, chiptune audio generated via the Web Audio API and CRT screen effects."
        badges = ["phaser3", "typescript", "vite", "tailwind"]
        [[languages.en.params.projects.items.links]]
          icon = "fab fa-github"
          url = "https://github.com/adamsalves/phantom-collector"
      [[languages.en.params.projects.items]]
        title = "Vue Planning Poker"
        repo = "planning-poker"
        language = "Vue 3"
        tagline = "real-time planning poker for agile teams"
        content = "Interactive table with live voting over WebSockets, customizable decks, consensus stats and history with charts."
        badges = ["vue3", "socketio", "pinia", "typescript"]
        [[languages.en.params.projects.items.links]]
          icon = "fab fa-github"
          url = "https://github.com/adamsalves/planning-poker"

