baseURL = "https://adamsalves.dev/"
defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false   # pt at /, en at /en/
# Two components, in precedence order — aeo-hugo first. It carries the AEO
# templates (llms.txt, llms-full.txt, the markdown twins, robots.txt, the
# sitemap and the JSON-LD graph) and the LLMS/LLMSFULL/MARKDOWN output formats
# the [outputs] block below names. The theme does not declare it: Hugo only
# resolves a module import when the project is module-based, and this site
# vendors both as git submodules.
theme = ["aeo-hugo", "terminal-mono"]
enableRobotsTXT = true
enableEmoji = true
summaryLength = 30

# ============================================================
#  Keep the quotes the HTML minifier would drop.
#
#  `hugo --minify` (vercel.json) emits valid HTML5 with unquoted attribute
#  values — `rel=canonical`, `name=description`, `type=application/ld+json`.
#  Browsers and Google parse that correctly. A number of smaller crawlers and
#  scoring tools do not: they match attributes with regexes that require the
#  quotes, so they report the page has no meta description, no canonical and no
#  structured data at all. `npx aeo.js check` v0.0.16 is one — with the quotes
#  gone it scores this site 0/20 on Schema Presence with two valid JSON-LD
#  blocks on the page, and drops two of the five Meta Quality checks.
#
#  The raw cost on this site's home page is 500 bytes (14,694 -> 15,194), which
#  is the number that reads as expensive and is not the one anyone pays. Vercel
#  serves this with `content-encoding: br`, and repeated quotes around repeated
#  attribute names are close to the most compressible text a page can hold:
#
#    gzip -9     4,477 -> 4,514   +37
#    brotli q5   4,267 -> 4,275    +8
#    brotli q11  3,896 -> 3,866   -30   ← the quoted page is *smaller*
#
#  So over the wire this costs nothing, and at a high brotli quality it pays for
#  itself. The cheapest 12 points on that scorecard by some distance.
# ============================================================
[minify]
  [minify.tdewolff.html]
    keepQuotes = true

[pagination]
  pagerSize = 5

[taxonomies]
  tag = "tags"

# ============================================================
#  Output formats — the theme defines LLMS, LLMSFULL and MARKDOWN, but Hugo's
#  default config merge does not bring a theme's [outputs] into the site's, so
#  the block has to live here. It publishes /llms.txt (the AEO index),
#  /llms-full.txt (every post's markdown in one file) and an index.md twin next
#  to each post's HTML — per language, so EN gets /en/llms.txt with its own list.
#
#  Naming any format for a page kind REPLACES the default list for that kind:
#  "RSS" is restated on purpose, because leaving it out kills the feed.
#  Kinds not named here (section, taxonomy, term) keep their defaults.
# ============================================================
[outputs]
  home = ["HTML", "RSS", "LLMS", "LLMSFULL"]
  page = ["HTML", "MARKDOWN"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# ============================================================
#  Nav menu — ordered by `weight`, mirroring the order the home page renders
#  its sections (projects, about, experience, contact). The theme's default
#  order leads with about, so the nav and the page disagreed on what comes
#  first. Section order lives in the theme's layout: reordering here moves the
#  menu, not the page.
#
#  One block serves both languages. The `identifier` doubles as the i18n key,
#  so "about" renders as "sobre" in PT and "about" in EN without repeating the
#  menu per language. Setting `name` would override the label with a literal
#  string and disable that translation — which is why none of these set it.
# ============================================================
[[menu.main]]
  identifier = "projects"
  url = "#projects"          # anchors resolve against the language's home
  weight = 10
[[menu.main]]
  identifier = "about"
  url = "#about"
  weight = 20
[[menu.main]]
  identifier = "experience"
  url = "#experience"
  weight = 30
[[menu.main]]
  identifier = "blog"
  pageRef = "/blogs"         # pageRef, not url: resolves per language, so PT
                             # links to /blogs/ and EN to /en/blogs/. Stays
                             # hidden while a language has no posts.
  weight = 40
[[menu.main]]
  identifier = "contact"
  url = "#contact"
  weight = 50

# ============================================================
#  Shared (non-translatable) params — merged into every language.
# ============================================================
[params]
  showScanlines = true       # CRT scanline overlay
  readingProgress = true     # reading-progress bar on posts
  terminalUser = "adams@portfolio"
  # favicon = "/favicon.svg" # the theme ships a favicon; set to override
  ogImage = "/images/og.png" # default image for Open Graph/Twitter (1200x630)
  # twitter = "adamsalves"   # handle (without @) for twitter:site

  # AI crawlers, in two groups robots.txt keeps separate because they are not
  # the same request. Answer engines fetch a page to answer a question now and
  # cite the source back to the reader; dataset crawlers collect it into a
  # corpus with no citation and no referral. Both default to `true`.
  [params.aeo]
    allowAI = true         # OAI-SearchBot, Claude-User, PerplexityBot, Applebot…
    allowTraining = false  # GPTBot, ClaudeBot, CCBot, Google-Extended…
    # /sitemap.xml as one flat <urlset> instead of Hugo's <sitemapindex>. The
    # index is the standard shape for a bilingual site and Google follows it,
    # but a crawler that does not know to descend into it reads the two <loc>s
    # and audits *those* as pages — /pt/sitemap.xml and /en/sitemap.xml, which
    # are XML with no title and no prose — and never opens a page of the site.
    # aeo.js reports "Crawled 3 page(s)" here, two of which are sitemaps. The
    # per-language sitemaps stay published either way.
    #
    # Site-wide, not per language: /sitemap.xml is one file. terminal-mono
    # reads it from the first language by weight and warns if another one
    # disagrees, so it belongs here at the root and nowhere else.
    flatSitemap = true

    # Only a production build is indexable. This depends on vercel.json passing
    # --environment: `hugo` (unlike `hugo server`) defaults to production when
    # the flag is absent, which made hugo.IsProduction true on preview deploys
    # too and left this param inert — every preview was crawlable, with a
    # Sitemap: line pointing at the production domain.
    #
    # It lived at [params] allowIndexing until the AEO templates became a
    # module; the root spelling still works and warns once.
    allowIndexing = false

    # Who publishes the site. The module reads this rather than the theme's
    # params — a component cannot know where a theme keeps its hero or its
    # social links — so the Person behind the JSON-LD is stated here. sameAs
    # mirrors [params.footer.socialNetworks]; jobTitle is translated and lives
    # under each language, mirroring [params.hero] subtitle.
    [params.aeo.publisher]
      type = "Person"
      sameAs = [
        "https://github.com/adamsalves",
        "https://linkedin.com/in/adams-alves",
      ]

  [params.navbar]
    brandName = "adamsalves"

  [params.hero.socialLinks]
    [[params.hero.socialLinks.fontAwesomeIcons]]
      icon = "fab fa-github"
      url = "https://github.com/adamsalves"
    [[params.hero.socialLinks.fontAwesomeIcons]]
      icon = "fab fa-linkedin-in"
      url = "https://linkedin.com/in/adams-alves"

  [params.about.skills]
    enable = true
    items = ["React", "Vue.js 3", "TypeScript", "Next.js", "Nuxt", "React Native", "CSS-in-JS", "Emotion", "SASS", "Jest", "Testing Library", "Design Systems", "Micro Front-ends", "Node.js"]

  [params.footer]
    copyright = "adamsalves"
    [params.footer.socialNetworks]
      github = "https://github.com/adamsalves"
      linkedin = "https://linkedin.com/in/adams-alves"

